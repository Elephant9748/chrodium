name: 'Prepare Build Deps Image'
description: 'Check and build build deps image by version'

inputs:
  version:
    required: true

runs:
  using: "composite"
  steps:
    - name: Checking image for "${{ inputs.version }}"
      shell: bash
      run: |
        VERSION="${{ inputs.version }}"
        IS_PRESENT=$(docker inspect --type=image Elephant9748/build-deps:$VERSION > /dev/null ; echo $?)
        if [ $IS_PRESENT -ne "0" ]; then
          IS_PRESENT=$(docker manifest inspect Elephant9748/build-deps:$VERSION > /dev/null ; echo $?)
          if [ $IS_PRESENT -ne "0" ]; then
            echo "Image not found"
          
            mkdir build-repo
            pushd build-repo/
          
            git clone https://github.com/Elephant9748/chrodium.git
            cd images/build-deps/
            DOCKER_BUILDKIT=1 docker build -t uazo/build-deps:$VERSION --progress plain .

            popd
            rm -rf build-repo
          fi
        fi
